# Build and test on every push and PR. On push to main, publish the web build to the `web-dist`
# branch (staging); on a `v*` release tag, to the `web-release` branch (production). Each web server
# pulls its branch every minute (see infra/autodeploy/).
name: web

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @eos/frontend build
      - name: Stamp the version served at /VERSION
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME (${GITHUB_SHA::7})"; else v="${GITHUB_SHA::7}"; fi
          echo "$v" > apps/frontend/dist/VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/frontend/dist
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.ref_type == 'tag' && 'web-release' || 'web-dist' }}
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      # Production follows the highest vX.Y.Z tag, like the production API (infra/autodeploy/README.md).
      # Any other tag (below it, or a pre-release such as v1.0.0-rc1) is built and tested but not published.
      - name: Skip a tag that is not the highest release
        id: latest
        run: |
          publish=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            highest="$(git ls-remote --tags --refs "$REMOTE" 'v*' | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            if [ "$GITHUB_REF_NAME" != "$highest" ]; then
              publish=false
              echo "::notice::$GITHUB_REF_NAME is not the highest release ($highest); web-release unchanged"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Push the build to its deploy branch
        if: steps.latest.outputs.publish == 'true'
        working-directory: dist
        run: |
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "web build $(cat VERSION)"
          git push -q --force "$REMOTE" "$TARGET"
