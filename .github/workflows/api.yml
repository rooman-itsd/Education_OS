# Backend: install every Python package and run the foundation tests on every push and PR.
name: api

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eos, POSTGRES_PASSWORD: eos, POSTGRES_DB: eos }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eos" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: tools/scripts/py-setup.sh
      - name: Tests on SQLite
        run: .venv/bin/python -m pytest apps/backend packages/core packages/testing platform/identity/backend platform/tenancy/backend platform/billing/backend -q
      # Every module and integration apps/backend/config/modules.enabled.yaml enables, one suite at a time
      # (each builds its own app and database).
      - name: Enabled modules' tests on SQLite
        run: |
          for t in $(.venv/bin/python tools/scripts/enabled-modules.py tests); do
            echo "::group::$t"; .venv/bin/python -m pytest "$t" -q; echo "::endgroup::"
          done
      - name: Migration chains on Postgres (upgrade, policies present, downgrade)
        env:
          EOS_DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
        run: |
          chains="$(.venv/bin/python tools/scripts/enabled-modules.py chains)"
          for d in $chains; do (cd "$d" && "$GITHUB_WORKSPACE/.venv/bin/alembic" upgrade head); done
          MODULE_PREFIXES="$(.venv/bin/python tools/scripts/enabled-modules.py prefixes)" .venv/bin/python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          want = {"identity_user", "tenancy_registration_token", "tenancy_organisation_module", "billing_subscription"}
          prefixes = tuple(os.environ["MODULE_PREFIXES"].split())
          with create_engine(os.environ["EOS_DATABASE_URL"]).connect() as c:
              rows = c.execute(text("select tablename, policyname from pg_policies")).all()
              forced = {r[0] for r in c.execute(text("select relname from pg_class where relrowsecurity and relforcerowsecurity"))}
              tenant = {r[0] for r in c.execute(text(
                  "select table_name from information_schema.columns where table_schema = 'public' and column_name = 'organisation_id'"
              ))}
          # every table an enabled module's chain created with organisation_id carries the policy too
          want |= {t for t in tenant if prefixes and t.startswith(prefixes)}
          have = {t for t, name in rows if name == "tenant_isolation"}
          assert want <= have and want <= forced, f"missing: policy {sorted(want - have)}, forced {sorted(want - forced)}"
          print("tenant_isolation forced on", sorted(want))
          PY
          for d in $(echo "$chains" | tac); do (cd "$d" && "$GITHUB_WORKSPACE/.venv/bin/alembic" downgrade base); done
      - name: Tests on Postgres with row-level security
        env:
          EOS_DATABASE_URL: postgresql+psycopg://eos:eos@localhost:5432/eos
        run: .venv/bin/python -m pytest apps/backend -q
