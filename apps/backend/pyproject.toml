[project]
name = "eos-backend"
version = "0.1.0"
description = "Education OS backend (API host): mounts every enabled module behind the entitlement gate."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pyyaml>=6", "eos-core", "eos-identity", "eos-tenancy", "eos-billing", "psycopg[binary]>=3.1", "pyjwt>=2.8", "structlog>=24", "sentry-sdk[fastapi]>=2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
