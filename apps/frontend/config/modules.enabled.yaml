# Modules composed into this app, as <domain>/<module> under modules/, platform services by name under
# platform/, and integrations by name under integrations/. The dashboard shell registers each listed one's
# frontend/src/widgets/index.ts.
# Example:
#   modules:
#     - academics/lms
#     - finance-operations/fees-accounts
#   platform:
#     - billing
#   integrations:
#     - payment-sbiepay
modules:
  - academics/academic-management
  - academics/examinations
  - campus-life/hostel
  - facilities/asset-management
  - facilities/facility-booking
  - facilities/inventory-equipment
  - facilities/maintenance
  - finance-operations/budget-grants
  - finance-operations/fees-accounts
  - student-lifecycle/enrolment-registration
  - student-lifecycle/admissions
  - student-lifecycle/web-portal-cms
  - support/helpdesk
platform:
  - billing
  - tenancy
  - identity
  - audit
  - reporting
