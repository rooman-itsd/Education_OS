# Modules composed into this app, as <domain>/<module> under modules/, and platform services by name
# under platform/. The dashboard shell registers each listed one's frontend/src/widgets/index.ts.
# Example:
#   modules:
#     - academics/lms
#     - finance-operations/fees-accounts
#   platform:
#     - billing
modules:
  - academics/academic-management
  - academics/examinations
  - campus-life/hostel
  - finance-operations/budget-grants
  - finance-operations/fees-accounts
  - student-lifecycle/web-portal-cms
  - support/helpdesk
platform:
  - billing
  - tenancy
  - identity
  - audit
