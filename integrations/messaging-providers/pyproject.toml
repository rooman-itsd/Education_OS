[project]
name = "eos-messaging-providers"
version = "0.1.0"
description = "Education OS integration: outbound messaging provider adapters (email first; SMS and WhatsApp later)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "eos-core"]

# How platform/notification finds this adapter WITHOUT importing it: the name is the adapter (which
# integration implements the OutboundMessaging port), not the vendor. Which vendor serves a channel is this
# module's own business, decided by MESSAGING_PROVIDERS_EMAIL. Requires an install (`pip install -e .`) before
# the entry point is discoverable.
[project.entry-points."eos.outbound_messaging"]
messaging-providers = "eos_messaging_providers.application.registry:get_provider"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
