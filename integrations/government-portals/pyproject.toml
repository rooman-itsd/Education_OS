[project]
name = "eos-government-portals"
version = "0.3.0"
description = "Education OS integration: AISHE, NIRF and NAAC submission packages (regulatory-submission port)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "eos-core"]

# How platform/integration-hub finds this adapter WITHOUT importing it (contracts/ports/adapter.yaml, registration).
# The entry point name is the adapter's folder name. Requires an install (`pip install -e .`) to be discoverable.
[project.entry-points."eos.integration_adapters"]
government-portals = "eos_government_portals.application.adapter:get_adapter"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
