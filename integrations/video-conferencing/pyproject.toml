[project]
name = "eos-video-conferencing"
version = "0.3.0"
description = "Education OS integration: Zoom, Microsoft Teams, Webex and Jitsi adapter for the meetings port."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "httpx>=0.27",
  "pydantic>=2",
  "PyJWT>=2.8",
  "cryptography>=42",
  "eos-core",
]

# How integration-hub finds this adapter WITHOUT importing it (contracts/ports/adapter.yaml, "registration"): the
# entry-point name is the adapter's folder name; the object is a factory returning the adapter, whose describe()
# is the registry row. Needs an install (`pip install -e .`) before the entry point is discoverable.
[project.entry-points."eos.integration_adapters"]
video-conferencing = "eos_video_conferencing.application.adapter:get_adapter"

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml", "eos-testing"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
