[project]
name = "eos-payment-sbiepay"
version = "0.1.0"
description = "Education OS integration: SBIePay payment gateway adapter (initiate, callback, verify, refund, reconcile)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "sqlalchemy>=2", "httpx>=0.27", "python-multipart>=0.0.9", "eos-core"]

[project.optional-dependencies]
test = ["pytest>=8", "eos-testing"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
