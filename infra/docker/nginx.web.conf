server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Future: proxy the FastAPI gateway
    # location /api/ { proxy_pass http://api:8000/; }

    # The service worker and the manifest must reach phones the day they change (apps/frontend/public/sw.js, #153):
    # browsers check them against the server, never a long-lived cached copy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
