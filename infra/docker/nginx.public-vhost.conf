# Public hostname for Education OS on the reverse-proxy container.
# Proxies to the static vhost on port 8080 in the same container (nginx.static-vhost.conf).
# Install to /etc/nginx/sites-available/educationos.futureacad.ae and symlink into sites-enabled,
# then run certbot --nginx -d educationos.futureacad.ae to add TLS and the 80 -> 443 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name educationos.futureacad.ae;

    access_log /var/log/nginx/educationos.access.log;
    error_log  /var/log/nginx/educationos.error.log;

    # API host (apps/backend). Set to the Docker host running docker-compose.api.yml.
    location /api/ {
        proxy_pass http://<api-host>:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak's admin console and Admin API, and the master realm (where its administrators sign in), answer
    # only on the LAN (ADR-0006): everyone else gets 404 here. Case-insensitive regex, so /auth/Admin/ cannot
    # fall through to /auth/ below; nginx normalises the URI (%2F, //, ..) before matching. Add the proxy's
    # own upstream address if a second proxy ever sits in front of this one.
    location ~* ^/auth/(admin|realms/master)(/|$) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        error_page 403 = @keycloak_lan_only;
        proxy_pass http://<api-host>:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        client_max_body_size 10m;
    }
    location @keycloak_lan_only {
        return 404;
    }

    # Keycloak, the OIDC provider (ADR-0006), on the same Docker host, port 8080, under /auth.
    location /auth/ {
        proxy_pass http://<api-host>:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
