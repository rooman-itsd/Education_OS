# Domain events published by tenancy.
# Naming: <module>.<entity>.<past-tense-verb>
# Every event carries: id, occurred_at, actor, organisation_id (tenant), version, payload.
module: tenancy
version: 1
events:
  - name: tenancy.organisation.registered
    description: A new organisation signed up and chose an academy type. Billing starts the trial; identity creates the admin user.
    payload: { organisation_id: uuid, slug: string, academy_type: string, admin_email: string }
  - name: tenancy.organisation.verified
    description: Admin email verified. The organisation now waits for super admin approval of its academic package.
    payload: { organisation_id: uuid, academy_type: string }
  - name: tenancy.package.requested
    description: An academic package needs super admin approval, at registration (kind=registration) or as a change (kind=change). The admin console shows the queue.
    payload: { organisation_id: uuid, academy_type: string, kind: string }
  - name: tenancy.organisation.approved
    description: Super admin approved the academic package.
    payload: { organisation_id: uuid, academy_type: string, approved_by: uuid }
  - name: tenancy.package.changed
    description: A package change was approved; the entitlement now follows the new academy profile.
    payload: { organisation_id: uuid, from: string, to: string, approved_by: uuid }
  - name: tenancy.organisation.activated
    description: The organisation can sign in (after approval).
    payload: { organisation_id: uuid }
  - name: tenancy.organisation.suspended
    description: Super admin suspended the organisation. Gateway refuses all its requests.
    payload: { organisation_id: uuid, reason: string }
  - name: tenancy.organisation.archived
    description: Organisation closed. Data retained per policy, then deleted. When a super admin's DELETE caused it, the payload also carries delete_after and requested_by.
    payload: { organisation_id: uuid, reason: string }
  - name: tenancy.organisation.exported
    description: A super admin downloaded the organisation's data export (DPDP). The actor is the super admin.
    payload: { organisation_id: uuid, actor: uuid, tables: integer, rows: integer }
  - name: tenancy.organisation.deletion_requested
    description: A super admin asked for the organisation to be deleted. It is archived now and purged after delete_after (EOS_ORGANISATION_RETENTION_DAYS, default 30) unless restored first.
    payload: { organisation_id: uuid, reason: string, delete_after: date-time, requested_by: uuid }
  - name: tenancy.organisation.restored
    description: A pending deletion was cancelled before the purge; the organisation is back in its previous status (tenancy.organisation.activated follows when that is active).
    payload: { organisation_id: uuid, status: string, restored_by: uuid }
  - name: tenancy.organisation.purged
    description: Every row of the organisation in every table with organisation_id, and the organisation itself, were deleted for good. The envelope's organisation_id is null because the tenant no longer exists; the payload carries its id, slug and rows deleted per table (counts only, no personal data). requested_by and requested_at come from the deletion request, because the purge removes that request's own outbox events.
    payload: { organisation_id: uuid, slug: string, purged_at: date-time, forced: boolean, rows_deleted: object, purged_by: uuid, requested_by: uuid, requested_at: date-time }
  - name: tenancy.entitlement.changed
    description: The set of modules, integrations or limits an organisation may use changed (plan change, override, toggle). Apps refresh.
    payload: { organisation_id: uuid, modules: [string], integrations: [string], plan: string }
