[project]
name = "eos-tenancy"
version = "0.1.0"
description = "Education OS platform service: organisations, registration, academy type, entitlements."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "sqlalchemy>=2", "alembic>=1.13", "eos-core", "eos-identity", "eos-billing"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
