openapi: 3.1.0
info:
  title: reporting API
  version: 0.2.0
  description: "Dashboards, MIS reports, analytics and warehouse ETL."
servers:
  - url: /api/v1/reporting
paths:
  /definitions:
    get:
      summary: List available report definitions
      description: Seeds the organisation's standard report definitions on first call, so a new organisation sees them.
      operationId: listDefinitions
      responses:
        "200":
          description: List of report definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDefinition"
    post:
      summary: Create custom report definition
      operationId: createDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDefinitionInput"
      responses:
        "201":
          description: Created report definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"
        "409":
          description: A report definition with this code already exists in the organisation

  /definitions/{id}:
    get:
      summary: Get report definition details
      operationId: getDefinition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report definition details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"
    put:
      summary: Update report definition
      operationId: updateDefinition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDefinitionInput"
      responses:
        "200":
          description: Updated report definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"

  /definitions/{id}/run:
    post:
      summary: Execute report
      operationId: runReport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunReportInput"
      responses:
        "200":
          description: Report execution result (fresh or idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExecution"

  /executions/{id}:
    get:
      summary: Get report execution output
      description: >-
        reporting:report:read covers academic and administrative runs. A run of a financial report (category
        financial, e.g. fee-collection-summary) needs reporting:report:execute; without it the run answers 404.
      operationId: getExecution
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Execution output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportExecution"

  /executions/{id}/export:
    get:
      summary: Export report output as CSV or JSON
      operationId: exportReport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: Presigned download URL for export file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"

  /executions/{id}/download:
    get:
      summary: Download exported report data directly
      description: Requires reporting:report:execute, the same as /executions/{id}/export.
      operationId: downloadExport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: File content
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: string }
        "403":
          description: Caller lacks reporting:report:execute
        "404":
          description: Execution not found

  /widgets/department-reports:
    get:
      summary: Snapshot for Department Admin widget
      operationId: getDepartmentReportsWidget
      parameters:
        - name: department_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Department report summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentReportsWidgetData"

  /metrics/definitions:
    get:
      summary: The versioned metric definitions ingested from the event bus, and what has no source yet
      description: Financial metrics are listed only to holders of reporting:report:execute.
      operationId: listMetricDefinitions
      responses:
        "200": { description: Definitions, content: { application/json: { schema: { type: object } } } }
  /metrics:
    get:
      summary: A metric's monthly snapshots for this organisation
      description: >-
        Rows carry tenant_id, source_module, metric_key, period_start, period_end, dimensions, value, unit,
        calculated_at and schema_version. A financial metric needs reporting:report:execute (404 otherwise).
      operationId: readMetric
      parameters:
        - { name: metric_key, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
        - { name: department_id, in: query, required: false, schema: { type: string } }
      responses:
        "200": { description: Snapshots, content: { application/json: { schema: { type: object } } } }
        "404": { description: Unknown metric, or a financial metric without reporting:report:execute }
  /metrics/recalculate:
    post:
      summary: Rebuild this organisation's snapshots for a month range from the ingested facts (reporting:report:manage)
      operationId: recalculateMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, pattern: "^\\d{4}-\\d{2}$" }
                to: { type: string, pattern: "^\\d{4}-\\d{2}$" }
                metric_key: { type: string, nullable: true }
      responses:
        "200": { description: Cells written, content: { application/json: { schema: { type: object, properties: { cells_written: { type: integer } } } } } }
  /widgets/attendance-and-results:
    get:
      summary: Cross-department comparison for Management widget
      operationId: getAttendanceAndResultsWidget
      responses:
        "200":
          description: Cross-department attendance and results comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceAndResultsWidgetData"

components:
  schemas:
    ReportDefinition:
      type: object
      required: [id, organisation_id, code, name, category, is_system, is_active, created_at, updated_at]
      properties:
        id: { type: string }
        organisation_id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        parameters_schema: { type: object }
        is_system: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateDefinitionInput:
      type: object
      required: [code, name, category]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        parameters_schema: { type: object }

    UpdateDefinitionInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        category: { type: string }
        parameters_schema: { type: object }
        is_active: { type: boolean }

    RunReportInput:
      type: object
      properties:
        parameters: { type: object }
        client_token: { type: string, description: "Idempotency key, unique per requester: a replay returns the caller's own run." }

    ReportExecution:
      type: object
      required: [id, organisation_id, report_definition_id, requested_by, status, executed_at]
      properties:
        id: { type: string }
        organisation_id: { type: string }
        report_definition_id: { type: string }
        requested_by: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        parameters: { type: object }
        result_summary: { type: object }
        export_file_id: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        client_token: { type: string, nullable: true }
        executed_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    ExportResponse:
      type: object
      required: [download_url, filename, format, expires_in_seconds]
      properties:
        download_url: { type: string }
        filename: { type: string }
        format: { type: string }
        expires_in_seconds: { type: integer }

    DepartmentReportsWidgetData:
      type: object
      required: [department_id, department_name, attendance_rate, exam_pass_rate, faculty_load_average, recent_reports]
      properties:
        department_id: { type: string }
        department_name: { type: string }
        attendance_rate: { type: number }
        exam_pass_rate: { type: number }
        faculty_load_average: { type: number }
        recent_reports:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              title: { type: string }
              generated_at: { type: string }

    AttendanceAndResultsWidgetData:
      type: object
      required: [institution_average_attendance, institution_average_pass_rate, departments]
      properties:
        institution_average_attendance: { type: number }
        institution_average_pass_rate: { type: number }
        departments:
          type: array
          items:
            type: object
            properties:
              department_id: { type: string }
              department_name: { type: string }
              attendance_rate: { type: number }
              pass_rate: { type: number }
              total_students: { type: integer }
              is_attendance_low: { type: boolean }
