[project]
name = "eos-reporting"
version = "0.1.0"
description = "Education OS module: reporting (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
  "eos-identity",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

# Ingests MetricSnapshot data from admissions, academic-management and fees-accounts events (application/ingest.py)
[project.entry-points."eos.event_consumers"]
reporting = "eos_reporting.application.ingest:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
