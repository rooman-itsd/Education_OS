# Alembic chain of platform/identity: own tables only, own version table (identity_alembic_version).
#   cd platform/identity/db && alembic upgrade head
# The database URL comes from EOS_DATABASE_URL (same as the app), or `alembic -x url=... upgrade head`.
# apps/backend still runs eos_core.init_db() (create_all + RLS) at startup as a safety net; the chain
# is the record of every schema change and what a deploy runs before the API starts.
[alembic]
script_location = %(here)s/migrations
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
