[project]
name = "eos-identity"
version = "0.1.0"
description = "Education OS platform service: identity (users, roles, sign-in, permissions)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "sqlalchemy>=2", "alembic>=1.13", "email-validator>=2", "eos-core"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
