openapi: 3.1.0
info:
  title: identity API
  version: 0.2.0
  description: "SSO (SAML / OAuth2 / OIDC), RBAC with fine-grained permissions, MFA, session management."
servers:
  - url: /api/v1/identity
paths:
  /auth/login:
    post:
      summary: Password sign-in; answers the platform's own token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401": { description: invalid credentials, or the organisation is not active }
  /auth/me:
    get:
      summary: The caller, with the permissions the role catalogues grant.
      responses:
        "200": { description: the user plus `permissions` and `impersonated_by` }
  /auth/oidc/config:
    get:
      summary: ADR-0006. What the sign-in page needs to start the authorization code flow with PKCE.
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCConfig"
        "404": { description: OIDC is off, or the organisation has no realm or is not active }
  /auth/oidc/callback:
    post:
      summary: ADR-0006. Redeem the authorization code; answers exactly like /auth/login.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCCallback"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401": { description: the code or the id token was refused, or the organisation or user is not active }
        "403": { description: "`no_account`: the realm knows the person, identity does not" }
        "404": { description: OIDC is not configured for the slug }
  /users:
    get:
      summary: Users of own organisation (identity:user:read). Erased users (tombstones) are left out.
      responses:
        "200": { description: list of users }
    post:
      summary: Create a user of own organisation (identity:user:manage).
      responses:
        "201": { description: the user }
        "403": { description: "A platform role, or a role no person may hold (`service`)." }
        "409":
          description: >-
            The organisation's plan allows no more active staff accounts. The plan's `users` limit counts staff
            only: a learner (a role `student` or `applicant`, or one whose dashboard layout extends `student`) is
            never counted and never refused here; learners are the plan's `students`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLimitReached" }
  /users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, maxLength: 36 } }
    patch:
      summary: Update a user of own organisation (identity:user:manage); DPDP s.12 correction.
      description: >-
        Changes any of name, email and roles; fields left out stay. Roles follow the rules of POST /users: no platform
        role, no role a person may not hold, and a learner made staff must fit the plan's `users` limit. Publishes
        identity.user.updated with the names of the changed fields (never their values).
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200": { description: the user }
        "403": { description: "A platform role, or a role no person may hold (`service`)." }
        "404": { description: No such user in own organisation (another organisation's user, or an erased one). }
        "409":
          description: >-
            `email_taken` (another user of the organisation has the email), `last_admin` (the change would take
            `org-admin` from the organisation's last active admin), or `plan_limit_reached` (as for POST /users).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Conflict" }
                  - { $ref: "#/components/schemas/PlanLimitReached" }
        "422": { description: No field given, or a field is invalid. }
    delete:
      summary: Erase a user of own organisation (identity:user:erase); DPDP s.12(3).
      description: >-
        Anonymises, never hard-deletes: other modules and the audit trail hold the user id. The row becomes a
        tombstone (status `erased`, name "Erased user", email `erased-<id>@erased.invalid`); the password hash, the
        Keycloak subject and the roles are removed, so the user can never sign in again and no token of theirs is
        accepted by a platform route. Publishes identity.user.erased so each module erases or anonymises what it
        holds. Erasing an erased user again changes nothing and answers 204.
      responses:
        "204": { description: erased }
        "404": { description: No such user in own organisation. }
        "409":
          description: "`last_admin`: the user is the organisation's last active admin."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conflict" }
  /users/{user_id}/disable:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, maxLength: 36 } }
    post:
      summary: Stop a user of own organisation signing in (identity:user:manage); offboarding.
      description: >-
        Password and Keycloak sign-in are refused, and every platform route (those guarded by identity's
        current_principal) refuses the user's existing tokens on the next request; Keycloak access tokens are
        re-checked on every request everywhere. Feature modules verify the platform's own HS256 token by signature
        and expiry alone, so one issued before the disable stays valid there until it expires
        (`EOS_JWT_TTL_MINUTES`, default 720 minutes). The user no longer counts against the plan's `users` limit.
        Disabling a disabled user changes nothing. Publishes identity.user.disabled.
      responses:
        "200": { description: "the user, `status` disabled" }
        "404": { description: No such user in own organisation. }
        "409":
          description: "`last_admin`: the user is the organisation's last active admin."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conflict" }
  /users/{user_id}/enable:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, maxLength: 36 } }
    post:
      summary: Let a disabled user of own organisation sign in again (identity:user:manage).
      description: >-
        A staff user must fit the plan's `users` limit again. An erased user cannot be enabled (404). Enabling an
        active user changes nothing. Publishes identity.user.enabled.
      responses:
        "200": { description: "the user, `status` active" }
        "404": { description: No such user in own organisation (or an erased one). }
        "409":
          description: The plan allows no more active staff accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanLimitReached" }
components:
  schemas:
    UpdateUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        roles: { type: array, minItems: 1, items: { type: string } }
    Conflict:
      type: object
      required: [detail, code]
      properties:
        detail: { type: string }
        code: { type: string, enum: [email_taken, last_admin] }
    PlanLimitReached:
      type: object
      required: [detail, code, limit, allowed, used]
      properties:
        detail: { type: string, examples: ["the plan allows 25 users; 25 are active"] }
        code: { type: string, const: plan_limit_reached }
        limit: { type: string, enum: [users], description: Which plan limit was reached. }
        allowed: { type: integer, description: The plan's limit on staff accounts. }
        used: { type: integer, description: Active staff accounts counted against it (learners are not). }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        organisation_slug: { type: string }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: the platform's own HS256 bearer token }
        user: { type: object }
    OIDCConfig:
      type: object
      required: [realm, issuer, authorization_endpoint, token_endpoint, client_id, response_type, scope, code_challenge_method]
      properties:
        realm: { type: string, description: the organisation slug }
        issuer: { type: string, format: uri }
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        end_session_endpoint: { type: string, format: uri }
        client_id: { type: string }
        response_type: { type: string, enum: [code] }
        scope: { type: string, example: openid email profile }
        code_challenge_method: { type: string, enum: [S256] }
    OIDCCallback:
      type: object
      required: [code, code_verifier, redirect_uri, slug]
      properties:
        code: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        redirect_uri: { type: string, format: uri }
        slug: { type: string, maxLength: 40 }
