role: management-student
title: "Management Student"
extends: student
module_roles:
  - projects-member
  - field-training-trainee
  - alumni-mentee
widgets:
  - productions.upcoming
  - projects.my-projects
  - field-training.my-placement
  - placement-career.openings
  - alumni.mentoring
  - lms.course-materials
