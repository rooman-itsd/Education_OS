# Dashboard layout for the Management (VC, Registrar) role. Widget ids are <module>.<widget>.
# Order is display order. The shell hides widgets the viewer lacks permission for.
role: management
title: "Management (VC, Registrar)"
module_roles:
  - grievance-viewer
  - regulatory-reports-viewer
  # Read-only oversight of the support modules (each module's default for management).
  - amc-vendor-support-viewer
  - knowledge-base-viewer
  - incident-management-viewer
  - sla-management-viewer
widgets:
  - admissions.funnel
  - fees-accounts.collection-vs-target
  - reporting.attendance-and-results-by-department
  - grievance.open
  - regulatory-reports.compliance-calendar
  - productions.upcoming
