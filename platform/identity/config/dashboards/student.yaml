# Dashboard layout for the Student role. Widget ids are <module>.<widget>.
# Order is display order. The shell hides widgets the viewer lacks permission for.
role: student
title: "Student"
module_roles:
  - lms-student
  - library-member
  - transport-rider
  - timetable-attendance-student
  - examinations-student
widgets:
  - timetable-attendance.today
  - timetable-attendance.attendance-summary
  - examinations.upcoming-assessments
  - lms.course-materials
  - fees-accounts.fee-dues
  - hostel.notices
  - transport.notices
  - library.loans
