[project]
name = "eos-workflow"
version = "0.1.0"
description = "Education OS module: workflow (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
  "eos-identity",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

[project.entry-points."eos.scheduler_jobs"]
workflow = "eos_workflow.application.jobs:JOBS"

[project.entry-points."eos.event_consumers"]
workflow = "eos_workflow.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
