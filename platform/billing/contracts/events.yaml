# Domain events published by billing.
module: billing
version: 1
events:
  - name: billing.subscription.started
    description: Trial or paid subscription began. tenancy recomputes the entitlement.
    payload: { organisation_id: uuid, plan: string, status: string, trial_ends_at: datetime }
  - name: billing.subscription.upgraded
    description: Payment confirmed for a higher plan. Entitlement widens immediately.
    payload: { organisation_id: uuid, from_plan: string, to_plan: string }
  - name: billing.subscription.downgraded
    description: Plan lowered at period end. Entitlement narrows; data is kept.
    payload: { organisation_id: uuid, from_plan: string, to_plan: string }
  - name: billing.trial.expiring
    description: >-
      Sent 7, 3 and 1 days before trial end by the daily billing.trial-reminders job. notification emails
      the org admin. threshold is the reminder (7, 3 or 1); days_left is the real days to go, lower when a
      reminder missed on its day is caught up on the next run. Each threshold is raised once per trial end
      (billing_trial_reminder); reminder_key (organisation, trial end, threshold) lets a consumer send it once.
    payload: { organisation_id: uuid, days_left: integer, threshold: integer, trial_ends_on: date, reminder_key: string }
  - name: billing.trial.expired
    description: Trial ended without upgrade. Organisation goes read-only or is suspended per plan policy.
    payload: { organisation_id: uuid, after_trial: string }
  - name: billing.subscription.expired
    description: Paid period ended unpaid.
    payload: { organisation_id: uuid, plan: string }
  - name: billing.invoice.issued
    payload: { organisation_id: uuid, invoice_id: string, amount: number, currency: string }
  - name: billing.invoice.paid
    payload: { organisation_id: uuid, invoice_id: string }
