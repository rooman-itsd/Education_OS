openapi: 3.1.0
info:
  title: billing API
  version: 0.3.0
  description: "Plans, trials, subscriptions, upgrades and invoices. See ADR-0005."
servers:
  - url: /api/v1/billing
paths:
  /plans:
    get:
      summary: Plans an organisation can choose (public, used on the pricing and upgrade pages).
      security: []
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } }
  /subscription:
    get:
      summary: The caller's organisation subscription, trial end and usage against limits.
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } } }
  /subscription/upgrade:
    post:
      summary: Start an upgrade to a plan. Returns a payment session from the payment adapter. Permission billing:subscription:manage.
      requestBody: { content: { application/json: { schema: { type: object, required: [plan], properties: { plan: { type: string }, billing_cycle: { type: string, enum: [monthly, yearly] } } } } } }
      responses: { "201": { description: Payment session, content: { application/json: { schema: { type: object, properties: { payment_url: { type: string }, reference: { type: string } } } } } } }
  /subscription/cancel:
    post:
      summary: Cancel at the end of the current period. Permission billing:subscription:manage.
      responses: { "204": { description: Scheduled } }
  /invoices:
    get:
      summary: Invoices of the caller's organisation, newest first; one per paid period. Permission billing:subscription:read.
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invoice" } } } } } }
  /billing-profile:
    get:
      summary: Who the caller's invoices are addressed to (the GST recipient). 404 until one is saved. Permission billing:subscription:read.
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingProfile" } } } }, "404": { description: None saved } }
    put:
      summary: "Set the recipient of future invoices. A GSTIN is optional (business-to-consumer without one); when given it is checked for format, state code and check character, and fixes the state. 422 on a bad GSTIN, an unknown state code, or a state code that disagrees with the GSTIN. Invoices already issued are not changed. Permission billing:subscription:manage."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingProfile" } } } }
      responses: { "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/BillingProfile" } } } }, "422": { description: Invalid GSTIN or state } }
  /webhooks/payment:
    post:
      summary: Payment adapter callback. Confirms an upgrade and activates the subscription.
      security: []
      responses: { "204": { description: Processed } }
  /admin/reports/subscriptions:
    get:
      summary: "Super admin (platform:revenue:read): subscriptions per plan and status, monthly recurring revenue (active subscriptions x the plan's monthly price), paid invoices of the last 30 days, and trials ending in the next 14 days, soonest first. Money as decimal strings."
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionReport" } } } } }
  /admin/plans:
    get:
      summary: All plans including unpublished. Super admin (platform:plans:manage).
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } }
    post:
      summary: Create a plan. Super admin.
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
      responses: { "201": { description: Created } }
  /admin/plans/{id}:
    put:
      summary: Edit a plan. Changes apply to existing subscribers at their next period. Super admin.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/Plan" } } } }
      responses: { "200": { description: OK } }
  /admin/subscriptions/{organisation_id}:
    put:
      summary: Set an organisation's plan, extend a trial, or comp a subscription. Super admin (platform:subscriptions:manage).
      parameters: [{ name: organisation_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { plan: { type: string }, trial_ends_at: { type: string, format: date-time }, comped_until: { type: string, format: date-time }, reason: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } } }
  /admin/revenue:
    get:
      summary: Subscriptions and revenue by plan and month. Super admin.
      responses: { "200": { description: OK } }
components:
  schemas:
    SubscriptionReport:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        trial_window_days: { type: integer, example: 14 }
        paid_window_days: { type: integer, example: 30 }
        plans:
          type: array
          items:
            type: object
            properties:
              plan: { type: string }
              title: { type: string }
              currency: { type: string, example: INR }
              subscriptions:
                type: object
                description: Count per subscription status.
                properties:
                  trialing: { type: integer }
                  active: { type: integer }
                  past_due: { type: integer }
                  read_only: { type: integer }
                  cancelled: { type: integer }
                  other: { type: integer, description: "A status outside the five above, counted rather than relabelled" }
              total: { type: integer }
              comped: { type: integer, description: "Active subscriptions comped by the super admin (comped_until in the future): counted in active, not in monthly_recurring" }
              monthly_recurring: { type: string, description: "Decimal, two places: active subscriptions that are not comped x price_per_month", example: "12500.00" }
              paid_last_30_days: { type: string, description: "Decimal, two places: paid invoices issued in the window", example: "25000.00" }
        trials_expiring:
          type: array
          items:
            type: object
            properties:
              organisation_id: { type: string, format: uuid }
              organisation_name: { type: string, nullable: true }
              plan: { type: string }
              trial_ends_at: { type: string, format: date-time }
              days_left: { type: integer, description: "Negative when the trial has ended but the daily expiry job has not made it read-only yet" }
    Plan:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price_per_month: { type: number }
        currency: { type: string }
        trial_days: { type: integer, nullable: true }
        suites: { type: array, items: { type: string } }
        modules: { type: array, items: { type: string } }
        specialized_suites: { oneOf: [{ type: integer }, { type: string, enum: [all] }] }
        integrations: { type: array, items: { type: string } }
        limits: { type: object, properties: { users: { type: integer }, students: { type: integer }, storage_gb: { type: integer } } }
        published: { type: boolean }
    Subscription:
      type: object
      properties:
        organisation_id: { type: string, format: uuid }
        plan: { type: string }
        status: { type: string, enum: [trialing, active, past_due, cancelled, read_only] }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        current_period_ends_at: { type: string, format: date-time, nullable: true }
        usage: { type: object, properties: { users: { type: integer }, students: { type: integer }, storage_gb: { type: number } } }
    Invoice:
      type: object
      properties:
        id: { type: string }
        organisation_id: { type: string, format: uuid }
        plan: { type: string, description: "Plan id the period was charged for" }
        amount: { type: number, description: "The taxable value (before GST); revenue reports use this, so they exclude GST" }
        currency: { type: string }
        status: { type: string, enum: [draft, due, paid, void] }
        issued_at: { type: string, format: date-time }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        payment_reference: { type: string, nullable: true, description: "Reference the payment adapter confirmed" }
        document_id: { type: string, nullable: true, description: "PDF in platform/documents; null until generated" }
        invoice_number: { type: string, nullable: true, maxLength: 16, description: "PREFIX/YY-YY/NNNNNN, one series per financial year (1 April to 31 March, Indian time), no gaps, never reused. Null on an invoice issued before 0.3.0." }
        financial_year: { type: string, nullable: true, example: "26-27" }
        tax_scheme: { type: string, enum: [intra, inter, none], nullable: true, description: "intra: CGST + SGST (place of supply is the supplier's state); inter: IGST; none: no supplier GSTIN configured, no tax charged" }
        sac_code: { type: string, nullable: true, description: "Service accounting code of the subscription, six digits" }
        gst_rate: { type: string, nullable: true, description: "Percent, two places; the whole rate (CGST and SGST are half each)", example: "18.00" }
        taxable_value: { type: string, nullable: true, description: "Decimal, two places" }
        cgst_amount: { type: string, nullable: true }
        sgst_amount: { type: string, nullable: true }
        igst_amount: { type: string, nullable: true }
        total_amount: { type: string, nullable: true, description: "taxable_value + cgst + sgst + igst" }
        place_of_supply: { type: string, nullable: true, description: "State code: the recipient's, or the supplier's when the recipient has no state on record" }
        supplier: { $ref: "#/components/schemas/InvoiceParty" }
        recipient: { $ref: "#/components/schemas/InvoiceParty" }
    InvoiceParty:
      type: object
      description: A party as it stood on the day the invoice was issued. The recipient's gstin is null for a business-to-consumer invoice.
      properties:
        name: { type: string, nullable: true }
        gstin: { type: string, nullable: true, minLength: 15, maxLength: 15 }
        address: { type: string, nullable: true }
        state_code: { type: string, nullable: true, description: "Two digits, the first two of a GSTIN" }
    BillingProfile:
      type: object
      required: [legal_name]
      properties:
        organisation_id: { type: string, format: uuid, readOnly: true }
        legal_name: { type: string }
        gstin: { type: string, nullable: true, description: "15 characters; upper-cased on save" }
        address: { type: string }
        state_code: { type: string, nullable: true, description: "Two digits; optional, taken from the GSTIN when there is one" }
