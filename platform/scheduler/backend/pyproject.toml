[project]
name = "eos-scheduler"
version = "0.1.0"
description = "Education OS module: scheduler (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "sqlalchemy>=2",
  "alembic",
  "arq",
  "eos-core",
  "eos-identity",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

# Closes the runs it handed out: <module>.job.finished from every module that declares a job.
[project.entry-points."eos.event_consumers"]
scheduler = "eos_scheduler.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
