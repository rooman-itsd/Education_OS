[project]
name = "eos-integration-hub"
version = "0.2.0"
description = "Education OS platform service: ports, adapter registry, connections, secret store, OAuth, provider callbacks, delivery log."
requires-python = ">=3.12"
# eos-identity for who is calling and eos-audit for the audit trail, both declared in module.yaml. Not eos-sdk:
# packages/sdk has no installable package yet (see platform/audit/backend/pyproject.toml).
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "pyyaml>=6",
  "cryptography>=42",
  "PyJWT>=2.8",
  "eos-core",
  "eos-identity",
  "eos-audit",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

# The modules' calling surface (docs/prd.md proposes sdk.integrations.invoke; see application/invoke.py).
[project.entry-points."eos.integration_hub"]
invoke = "eos_integration_hub.application.invoke:invoke"

# The sweep, healthchecks, token refresh and retention, run by platform/scheduler.
[project.entry-points."eos.scheduler_jobs"]
integration-hub = "eos_integration_hub.application.jobs:JOBS"

[project.entry-points."eos.event_consumers"]
integration-hub = "eos_integration_hub.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
