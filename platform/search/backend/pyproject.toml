[project]
name = "eos-search"
version = "0.1.0"
description = "Education OS platform service: search (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2",
  "sqlalchemy>=2",
  "alembic",
  "pyyaml",
  "opensearch-py",
  "arq",
  "eos-core",
  "eos-identity",
  "eos-audit",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

# Indexes records from the events their module declared searchable (contracts/searchable.yaml in the module).
[project.entry-points."eos.event_consumers"]
search = "eos_search.application.consumers:CONSUMERS"

# The provider entry-point group MODULES register on (not search itself): eos.search_documents.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["opensearch: runs against a real cluster; skipped unless SEARCH_TEST_OPENSEARCH_URL is set"]
