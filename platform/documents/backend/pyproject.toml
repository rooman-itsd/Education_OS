[project]
name = "eos-documents"
version = "0.1.0"
description = "Education OS platform service: documents (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "minio",
  "eos-core",
  "eos-identity",
]

[project.entry-points."eos.event_consumers"]
documents = "eos_documents.application.consumers:CONSUMERS"

[tool.pytest.ini_options]
testpaths = ["tests"]
