openapi: 3.1.0
info:
  title: documents API
  version: 0.2.0
  description: "Document and media management: storage abstraction, presigned URLs, and access control."
servers:
  - url: /api/v1/documents

paths:
  /upload-intent:
    post:
      summary: Request a presigned URL to upload a document
      operationId: requestUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadIntentInput"
      responses:
        "201":
          description: Upload intent registered and presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResult"
        "200":
          description: >-
            Idempotent replay of an upload intent still pending. The URL names an upload key of its own, never the
            document's storage key: confirm copies the validated object there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntentResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            Replay of an intent whose document is already confirmed (or deleted): no upload URL is issued. A changed
            file is a new version (POST /{id}/versions).

  /{id}/versions:
    post:
      summary: Upload intent for the next version of a document (then PUT and confirm, as for /upload-intent)
      description: >-
        Only the latest confirmed version can be followed, and only by the uploader of the document's first
        version. Confirming the new version supersedes the previous one, which stays readable.
      operationId: requestNewVersion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mime_type, size_bytes]
              properties:
                filename: { type: string, maxLength: 255 }
                mime_type: { type: string, maxLength: 128 }
                size_bytes: { type: integer, minimum: 1 }
                client_token: { type: string, maxLength: 120, nullable: true }
      responses:
        "201": { description: New version registered, content: { application/json: { schema: { $ref: "#/components/schemas/UploadIntentResult" } } } }
        "200": { description: Idempotent replay of a pending new-version intent, content: { application/json: { schema: { $ref: "#/components/schemas/UploadIntentResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The document is not the latest confirmed version }
    get:
      summary: Every version of the document, newest first
      description: Visible on the same terms as the document itself.
      operationId: listVersions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

  /{id}/confirm:
    post:
      summary: Confirm that a document was uploaded into storage
      operationId: confirmUpload
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document upload confirmed and status set to available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A new version confirmed first against the same predecessor }

  /{id}:
    get:
      summary: Get document metadata
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      summary: Delete a document from storage and metadata catalog
      operationId: deleteDocument
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  document_id: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /{id}/download-url:
    get:
      summary: Generate a presigned temporary download URL
      operationId: getDownloadUrl
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Temporary presigned download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /:
    get:
      summary: List and search documents
      operationId: listDocuments
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: entity_type
          in: query
          required: false
          schema: { type: string }
        - name: entity_id
          in: query
          required: false
          schema: { type: string }
        - name: uploaded_by
          in: query
          required: false
          schema: { type: string }
        - name: include_superseded
          in: query
          required: false
          description: By default only each document's latest version is listed.
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResult"
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  schemas:
    UploadIntentInput:
      type: object
      required:
        - filename
        - mime_type
        - size_bytes
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        title:
          type: string
          maxLength: 255
        mime_type:
          type: string
          minLength: 3
          maxLength: 128
        size_bytes:
          type: integer
          minimum: 1
        entity_type:
          type: string
          maxLength: 64
        entity_id:
          type: string
          maxLength: 64
        client_token:
          type: string
          maxLength: 120
        tags:
          type: array
          items: { type: string }

    UploadIntentResult:
      type: object
      required:
        - document
        - upload_url
        - method
        - expires_in_seconds
      properties:
        document:
          $ref: "#/components/schemas/Document"
        upload_url:
          type: string
        method:
          type: string
          example: PUT
        expires_in_seconds:
          type: integer

    DownloadUrlResult:
      type: object
      required:
        - download_url
        - filename
        - expires_in_seconds
      properties:
        download_url:
          type: string
        filename:
          type: string
        expires_in_seconds:
          type: integer

    Document:
      type: object
      required:
        - id
        - organisation_id
        - filename
        - title
        - mime_type
        - size_bytes
        - status
        - uploaded_by
        - created_at
      properties:
        id: { type: string }
        organisation_id: { type: string }
        title: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        status:
          type: string
          enum: [pending_upload, available, archived, deleted]
        entity_type: { type: string, nullable: true }
        entity_id: { type: string, nullable: true }
        uploaded_by: { type: string }
        client_token: { type: string, nullable: true }
        version: { type: integer, description: "1 for a document's first version" }
        version_of: { type: string, nullable: true, description: The first version's id; null on the first version }
        superseded_by: { type: string, nullable: true, description: The newer version that replaced this one }
        tags:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentListResult:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        total: { type: integer }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: Invalid request payload or parameter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not entitled or insufficient permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
