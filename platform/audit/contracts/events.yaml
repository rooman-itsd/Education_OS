# Domain events published by audit.
# Envelope: see platform/event-bus/contracts/events.yaml. Payloads below never repeat it.
module: audit
version: 1

# Audit is a sink: it records other modules' state changes from their events (see `consumes`,
# application/consumers.py). The few events here are about the audit trail itself, not about
# what was audited. Re-publishing audited actions as
# events would duplicate the publishing module's own events and double every consumer's work.
events:
  - name: audit.export.ready
    version: 1
    description: >-
      A compliance export finished and is available through platform/documents.
    payload:
      export_id: uuid
      document_id: uuid
      record_count: integer
      occurred_from: datetime
      occurred_to: datetime

  - name: audit.record.redacted
    version: 1
    description: >-
      A record's before/after payload was replaced by a tombstone under a legal erasure
      request. The record itself remains; only the payload is gone.
    payload:
      record_id: uuid
      reason: string
      redacted_by: uuid

  - name: audit.retention.pruned
    version: 1
    description: >-
      Records older than the retention window were removed. Raised once per prune run so the
      removal is itself accounted for.
    payload:
      removed_count: integer
      older_than: datetime

  - name: audit.job.finished
    version: 1
    description: >-
      The outcome of an audit.prune run, for platform/scheduler, which closes the run.
    payload:
      run_id: uuid
      outcome: string
      detail: string

# Each becomes one record in the event's organisation (idempotent on the event id); super admin
# operations on an organisation also get a platform-level record. scheduler.job.due runs audit.prune.
consumes:
  - tenancy.organisation.registered
  - tenancy.organisation.verified
  - tenancy.package.requested
  - tenancy.organisation.approved
  - tenancy.package.changed
  - tenancy.organisation.activated
  - tenancy.organisation.suspended
  - tenancy.organisation.archived
  - tenancy.organisation.exported
  - tenancy.organisation.deletion_requested
  - tenancy.organisation.restored
  - tenancy.organisation.purged
  - tenancy.entitlement.changed
  - tenancy.impersonation.started
  - identity.user.created
  - identity.user.oidc_linked
  - billing.subscription.started
  - billing.subscription.upgraded
  - billing.subscription.downgraded
  - billing.subscription.expired
  - billing.trial.expired
  - billing.invoice.issued
  - billing.invoice.paid
  - workflow.request.submitted
  - workflow.step.advanced
  - workflow.request.approved
  - workflow.request.rejected
  - workflow.request.delegated
  - documents.document.uploaded
  - documents.document.deleted
  - reporting.report.executed
  - reporting.report.exported
  - scheduler.job.due
