[project]
name = "eos-audit"
version = "0.1.0"
description = "Education OS module: audit (backend)"
requires-python = ">=3.12"
# eos-identity, not eos-sdk: packages/sdk has no installable package yet, so depending on it made this
# uninstallable. identity is the declared platform dependency (module.yaml) for permissions and actor names.
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
  "eos-identity",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
