[project]
name = "eos-notification"
version = "0.1.0"
description = "Education OS module: notification (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
  "eos-identity",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "eos-testing"]

# Emails sent in reaction to other modules' events, delivered by platform/event-bus's relay.
[project.entry-points."eos.event_consumers"]
notification = "eos_notification.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
