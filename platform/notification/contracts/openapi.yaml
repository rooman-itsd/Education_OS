openapi: 3.1.0
info:
  title: notification API
  version: 0.1.0
  description: >-
    Email, SMS, WhatsApp, push and in-app notifications with templates, recipient preferences
    and delivery status. Modules say who to tell and what about; this service renders, routes
    and sends. The physical connection to a provider belongs to
    integrations/messaging-providers. Email is implemented first; the other channels are in
    the contract so modules can be written against them.
servers:
  - url: /api/v1/notification

paths:
  /messages:
    post:
      summary: Send a notification
      description: >-
        Queues a message for one recipient. Idempotent on client_token, which is the only
        idempotency key: a retry, or an event redelivered by the at-least-once bus, returns the
        original message instead of sending twice. A redelivery whose variables differ from the
        first is a 422, not a silent return. Prefer reacting to an event over calling this inline;
        a message sent before its transaction commits cannot be unsent.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMessage" }
      responses:
        "202":
          description: Accepted for delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "200":
          description: Already accepted with this client_token; the original is returned, even if
            the recipient's preferences or account changed since
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >-
            Either this module's refusal - unknown template, no template for the channel and locale,
            variables not an object or over 30 entries, a non-scalar or over-long variable, a missing
            variable, no address for the channel, or a rendered subject longer than 300 characters - or the
            framework's request-validation response when the body does not match NewMessage.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"

    get:
      summary: List messages
      description: Organisation-scoped delivery history, most recent first.
      operationId: listMessages
      parameters:
        - name: recipient_id
          in: query
          schema: { type: string, format: uuid }
        - name: template
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/Channel" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: sent_from
          in: query
          schema: { type: string, format: date-time }
        - name: sent_to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >-
            A query parameter does not match its declared type or bounds - a status or channel outside its
            enum, an unparseable sent_from or sent_to, or a limit or offset out of range. This is the
            framework's response, raised before the handler runs, so it never has the Error shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /messages/{message_id}:
    get:
      summary: Get one message and its delivery status
      operationId: getMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /messages/{message_id}/resend:
    post:
      summary: Resend a failed message
      description: >-
        Operator action for a message that failed or bounced. A delivered message is not
        resent. Audited.
      operationId: resendMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The message was delivered and will not be resent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates:
    get:
      summary: List templates
      description: >-
        Platform defaults plus this organisation's overrides. An organisation never sees
        another's templates.
      operationId: listTemplates
      parameters:
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/Channel" }
        - name: locale
          in: query
          schema: { type: string, examples: ["en", "hi", "kn"] }
      responses:
        "200":
          description: A page of templates
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >-
            The channel query parameter is outside its enum. This is the framework's response, raised
            before the handler runs, so it never has the Error shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

    post:
      summary: Create or override a template for this organisation
      operationId: upsertTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTemplate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >-
            Either this module's refusal or the framework's request-validation response when the body does
            not match NewTemplate (an unknown channel, a key over 120 characters, a locale over 10, or a
            missing body).

            This module refuses, in this order: the key is not an existing platform template; that template
            is not overridable; the channel is one the template does not support; the locale is malformed;
            the category differs from the template's own; the request's `variables` LIST names something the
            template does not declare; a subject was given for a non-email channel; the subject contains CR
            or LF (a second line would be a mail header); the body is empty or the body or subject exceeds
            its length limit; a PLACEHOLDER in the subject or body is malformed (an unclosed or invalid
            `$...`); or a placeholder in the subject or body names a variable the template does not declare.

            The last two are checked against the subject and body text itself and are not the same as the
            `variables` list check above: a request may send a valid `variables` list and still be refused
            for a placeholder inside the body, or send no `variables` at all and be refused for one.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"

  /templates/{key}/preview:
    post:
      summary: Render a template without sending
      description: Lets an admin see their change before it reaches anyone.
      operationId: previewTemplate
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                channel: { $ref: "#/components/schemas/Channel" }
                locale: { type: string }
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Rendered output
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  subject: { type: [string, "null"] }
                  body: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >-
            Either this module's refusal - unknown template, a channel the template does not support, a
            missing variable, or a variable it does not declare - or the framework's request-validation
            response when the body does not match the declared shape.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"

  /preferences/{user_id}:
    get:
      summary: Get a recipient's channel preferences
      operationId: getPreferences
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such user in this organisation. A 404 rather than a 403, because whether a user
            id exists in another organisation is itself information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            user_id is not a valid uuid. Note the order: the id is parsed before the permission comparison,
            so a malformed id from a caller who also lacks notification:preference:manage is answered 422
            rather than 403. This operation takes no request body and no query parameters, so the
            framework's validation response cannot arise here - only this module's own refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    put:
      summary: Replace a recipient's channel preferences
      description: >-
        Transactional categories cannot be disabled; a request to switch them off is accepted
        for the other categories and the transactional ones remain on.
      operationId: setPreferences
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Updated preferences as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such user in this organisation. A 404 rather than a 403, because whether a user
            id exists in another organisation is itself information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >-
            user_id is not a valid uuid. Note the order: the id is parsed before the permission comparison,
            so a malformed id from a caller who also lacks notification:preference:manage is answered 422
            rather than 403.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"

  /inbox:
    get:
      summary: The signed-in user's in-app notifications
      description: Backs the in-app bell and its dashboard widget.
      operationId: listInbox
      parameters:
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: Inbox page
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  unread: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: >-
            unread_only is not a boolean, or limit is out of range. This is the framework's response,
            raised before the handler runs, so it never has the Error shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /inbox/{message_id}/read:
    post:
      summary: Mark an in-app notification read
      operationId: markRead
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Marked read }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  schemas:
    Channel:
      type: string
      enum: [email, sms, whatsapp, push, in_app]
      description: Only email is implemented in week 2; the rest are contracted ahead.

    Status:
      type: string
      enum: [queued, sending, delivered, failed, bounced, suppressed]
      description: >-
        suppressed means the recipient's preferences or a previous hard bounce stopped it
        before it was sent.

    Category:
      type: string
      enum: [transactional, operational, reminder, announcement]
      description: >-
        transactional (verification, password reset, security) is always sent and cannot be
        switched off. The rest are opt-out.

    NewMessage:
      type: object
      required: [template, recipient]
      properties:
        client_token:
          type: string
          maxLength: 120
          description: >-
            The ONLY idempotency key. Unique per logical notification, and required in practice,
            because event delivery is at-least-once and the same event may arrive twice. The same
            token with a different request is a 422, comparing the template, the requested channel,
            the recipient as given and the non-secret variables; an omitted channel and an explicit
            one are different requests. An event-linked send does not supply this: it derives
            "evt:" + sha256("<event>|<template>|<channel>|<recipient>"), and supplying a token that
            disagrees with the derived one is a 422.
        template:
          type: string
          description: Template key
          examples: ["tenancy.organisation.verify"]
        recipient:
          type: object
          description: >-
            Either a user_id, which resolves address, locale and preferences from identity, or
            a raw address for someone who has no account yet.
          properties:
            user_id: { type: [string, "null"], format: uuid }
            address:
              type: [string, "null"]
              description: Email address or phone number, when there is no user yet
            locale: { type: [string, "null"] }
        channel:
          allOf: [{ $ref: "#/components/schemas/Channel" }]
          description: Omit to let the recipient's preferences decide.
        category:
          allOf: [{ $ref: "#/components/schemas/Category" }]
          default: operational
        variables:
          type: object
          additionalProperties: true
          description: Values the template needs. A missing one is a 422, never a blank in the output.
        attachments:
          type: array
          description: Document ids from platform/documents. Never file bytes.
          items:
            type: object
            required: [document_id]
            properties:
              document_id: { type: string, format: uuid }
              filename: { type: [string, "null"] }
        send_after:
          type: [string, "null"]
          format: date-time
          description: >-
            Earliest send time. For anything beyond a short delay use platform/scheduler
            rather than parking a message here.

    Message:
      type: object
      required: [id, organisation_id, template, channel, status, created_at]
      properties:
        id: { type: string, format: uuid }
        organisation_id:
          type: [string, "null"]
          format: uuid
          description: Null for platform-level messages outside any organisation
        template: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        category: { $ref: "#/components/schemas/Category" }
        status: { $ref: "#/components/schemas/Status" }
        recipient_id: { type: [string, "null"], format: uuid }
        recipient_address:
          type: string
          description: Masked on read, e.g. a***@example.com. Never returned in full.
        subject: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        read_at:
          type: [string, "null"]
          format: date-time
          description: In-app only
        attempts: { type: integer }
        last_error: { type: [string, "null"] }
        provider_message_id:
          type: [string, "null"]
          description: Set by integrations/messaging-providers, for tracing a message at the provider

    NewTemplate:
      type: object
      required: [key, channel, locale, body]
      properties:
        key:
          type: string
          examples: ["tenancy.organisation.verify"]
        channel: { $ref: "#/components/schemas/Channel" }
        locale: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        subject:
          type: [string, "null"]
          description: Email only
        body:
          type: string
          description: Template source. Variables are named placeholders, never executable code.
        variables:
          type: array
          description: Variables this template requires; used to validate a send and a preview
          items: { type: string }

    Template:
      allOf:
        - $ref: "#/components/schemas/NewTemplate"
        - type: object
          required: [id, scope]
          properties:
            id: { type: string, format: uuid }
            scope:
              type: string
              enum: [platform, organisation]
              description: >-
                platform templates are the fallback shipped with the product; organisation
                templates override them for one academy.
            updated_at: { type: string, format: date-time }

    Preferences:
      type: object
      required: [user_id, channels]
      properties:
        user_id: { type: string, format: uuid }
        locale: { type: [string, "null"] }
        channels:
          type: object
          description: Per category, the channels this person accepts.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Channel" }
        quiet_hours:
          type: [object, "null"]
          description: Local-time window in which only transactional messages are sent
          properties:
            start: { type: string, examples: ["21:00"] }
            end: { type: string, examples: ["07:00"] }
            timezone: { type: string, examples: ["Asia/Kolkata"] }

    Error:
      type: object
      description: >-
        An application-level refusal raised by this module: `detail` is one sentence. Every 4xx this
        module raises itself has this shape.
      required: [detail]
      properties:
        detail: { type: string }

    ValidationIssue:
      type: object
      description: One problem the framework found while validating the request.
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: >-
            Where the problem is, from the outside in - for example ["body", "channel"] or
            ["query", "limit"]. Integers appear for positions inside an array.
          items:
            type: [string, integer]
        msg: { type: string }
        type: { type: string }

    ValidationError:
      type: object
      description: >-
        The framework's own request-validation response, returned before this module's handler runs when
        the request body, query or path does not match the declared schema. `detail` is a LIST here, not a
        string, which is why it cannot share a schema with Error. No handler rewrites it: normalising it
        would change behaviour for every platform module, which is out of scope here.
      required: [detail]
      properties:
        detail:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }

  responses:
    Forbidden:
      description: Missing permission, or the object belongs to another organisation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such object in this organisation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
