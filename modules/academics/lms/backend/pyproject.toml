[project]
name = "eos-lms"
version = "0.1.0"
description = "Education OS module: lms (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pyyaml", "eos-testing"]

[project.entry-points."eos.event_consumers"]
lms = "eos_lms.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
