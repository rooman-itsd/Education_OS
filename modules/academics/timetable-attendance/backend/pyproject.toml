[project]
name = "eos-timetable-attendance"
version = "0.1.0"
description = "Education OS module: timetable-attendance (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml"]

[project.entry-points."eos.event_consumers"]
timetable-attendance = "eos_timetable_attendance.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
