[project]
name = "eos-academic-management"
version = "0.1.0"
description = "Education OS module: academic-management (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml"]

# platform/search finds this module's document provider here (platform/search README, "What each first module must add").
[project.entry-points."eos.search_documents"]
academic-management = "eos_academic_management.search:PROVIDER"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
