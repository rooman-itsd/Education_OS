# Alembic chain of facility-booking: own tables only, own version table.
#   cd modules/facilities/facility-booking/db && alembic upgrade head
# The database URL comes from EOS_DATABASE_URL (same as the app), or `alembic -x url=... upgrade head`.
[alembic]
script_location = %(here)s/migrations
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
