# HTTP contract for athlete-performance. The only way other modules call this one synchronously.
# Every path is scoped to the caller's organisation (row-level security on organisation_id).
openapi: 3.1.0
info:
  title: athlete-performance API
  version: 0.1.0
  description: Athlete profiles, performance metrics, fitness testing, benchmarks.
servers:
- url: /api/v1/athlete-performance
security:
- bearerAuth: []
paths:
  /disciplines:
    get:
      summary: List disciplines
      description: 'Permission: `athlete-performance:catalogue:read`.'
      operationId: listDisciplines
      parameters:
      - name: active
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of disciplines
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Discipline'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create discipline
      description: 'Permission: `athlete-performance:catalogue:write`.'
      operationId: createDiscipline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisciplineRequest'
      responses:
        '201':
          description: Discipline created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discipline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /disciplines/{discipline_id}:
    parameters:
    - name: discipline_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get discipline
      description: 'Permission: `athlete-performance:catalogue:read`.'
      operationId: getDiscipline
      responses:
        '200':
          description: Discipline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discipline'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update discipline
      description: 'Permission: `athlete-performance:catalogue:write`.'
      operationId: updateDiscipline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDisciplineRequest'
      responses:
        '200':
          description: Discipline updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discipline'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /metrics:
    get:
      summary: List metric definitions
      description: 'Permission: `athlete-performance:catalogue:read`.'
      operationId: listMetrics
      parameters:
      - name: discipline_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of metric definitions
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Metric'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create metric definition
      description: 'Permission: `athlete-performance:catalogue:write`.'
      operationId: createMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetricRequest'
      responses:
        '201':
          description: Metric definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /metrics/{metric_id}:
    parameters:
    - name: metric_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get metric definition
      description: 'Permission: `athlete-performance:catalogue:read`.'
      operationId: getMetric
      responses:
        '200':
          description: Metric definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update metric definition
      description: 'Permission: `athlete-performance:catalogue:write`.'
      operationId: updateMetric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMetricRequest'
      responses:
        '200':
          description: Metric definition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /athletes:
    get:
      summary: List athlete profiles
      description: 'Athletes see only their own profile; coaches and staff see the athletes of their organisation. Permission:
        `athlete-performance:athlete:read`.'
      operationId: listAthletes
      parameters:
      - name: discipline_id
        in: query
        schema:
          type: string
          format: uuid
      - name: coach_id
        in: query
        schema:
          type: string
          format: uuid
      - name: squad
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
          - alumni
      - name: q
        in: query
        schema:
          type: string
          description: Search by name
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of athlete profiles
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Athlete'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create athlete profile
      description: 'Permission: `athlete-performance:athlete:write`.'
      operationId: createAthlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAthleteRequest'
      responses:
        '201':
          description: Athlete profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /athletes/{athlete_id}:
    parameters:
    - name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get athlete profile
      description: 'Permission: `athlete-performance:athlete:read`.'
      operationId: getAthlete
      responses:
        '200':
          description: Athlete profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update athlete profile
      description: 'Permission: `athlete-performance:athlete:write`.'
      operationId: updateAthlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAthleteRequest'
      responses:
        '200':
          description: Athlete profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /results:
    get:
      summary: List performance results
      description: 'Permission: `athlete-performance:result:read`.'
      operationId: listResults
      parameters:
      - name: athlete_id
        in: query
        schema:
          type: string
          format: uuid
      - name: metric_id
        in: query
        schema:
          type: string
          format: uuid
      - name: context
        in: query
        schema:
          type: string
          enum:
          - training
          - trial
          - competition
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of performance results
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PerformanceResult'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Record a performance result
      description: 'Permission: `athlete-performance:result:record`.'
      operationId: recordResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePerformanceResultRequest'
      responses:
        '201':
          description: Performance result created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /results/{result_id}:
    parameters:
    - name: result_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get performance result
      description: 'Permission: `athlete-performance:result:read`.'
      operationId: getResult
      responses:
        '200':
          description: Performance result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Correct a performance result
      description: 'Permission: `athlete-performance:result:record`.'
      operationId: updateResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePerformanceResultRequest'
      responses:
        '200':
          description: Performance result updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /fitness-tests:
    get:
      summary: List fitness tests
      description: 'Permission: `athlete-performance:catalogue:read`.'
      operationId: listFitnessTests
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of fitness tests
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FitnessTest'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create fitness test
      description: 'Permission: `athlete-performance:catalogue:write`.'
      operationId: createFitnessTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFitnessTestRequest'
      responses:
        '201':
          description: Fitness test created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessTest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /fitness-tests/{fitness_test_id}:
    parameters:
    - name: fitness_test_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get fitness test
      description: 'Permission: `athlete-performance:catalogue:read`.'
      operationId: getFitnessTest
      responses:
        '200':
          description: Fitness test
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessTest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update fitness test
      description: 'Permission: `athlete-performance:catalogue:write`.'
      operationId: updateFitnessTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFitnessTestRequest'
      responses:
        '200':
          description: Fitness test updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessTest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /assessments:
    get:
      summary: List fitness assessments
      description: 'Permission: `athlete-performance:assessment:read`.'
      operationId: listAssessments
      parameters:
      - name: athlete_id
        in: query
        schema:
          type: string
          format: uuid
      - name: fitness_test_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of fitness assessments
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FitnessAssessment'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Record a fitness assessment
      description: 'Permission: `athlete-performance:assessment:record`.'
      operationId: recordAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFitnessAssessmentRequest'
      responses:
        '201':
          description: Fitness assessment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessAssessment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /assessments/{assessment_id}:
    parameters:
    - name: assessment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get fitness assessment
      description: 'Permission: `athlete-performance:assessment:read`.'
      operationId: getAssessment
      responses:
        '200':
          description: Fitness assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessAssessment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /benchmarks:
    get:
      summary: List benchmarks
      description: 'Permission: `athlete-performance:benchmark:read`.'
      operationId: listBenchmarks
      parameters:
      - name: metric_id
        in: query
        schema:
          type: string
          format: uuid
      - name: discipline_id
        in: query
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          maximum: 200
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: Page of benchmarks
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Benchmark'
                  total:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create benchmark
      description: 'Permission: `athlete-performance:benchmark:write`.'
      operationId: createBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenchmarkRequest'
      responses:
        '201':
          description: Benchmark created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benchmark'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /benchmarks/{benchmark_id}:
    parameters:
    - name: benchmark_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get benchmark
      description: 'Permission: `athlete-performance:benchmark:read`.'
      operationId: getBenchmark
      responses:
        '200':
          description: Benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benchmark'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update benchmark
      description: 'Permission: `athlete-performance:benchmark:write`.'
      operationId: updateBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBenchmarkRequest'
      responses:
        '200':
          description: Benchmark updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Benchmark'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /athletes/{athlete_id}/history:
    parameters:
    - name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Performance history for one metric
      description: 'Results and assessment measurements over time, with the matching benchmark if one exists. Permission:
        `athlete-performance:result:read`.'
      operationId: getPerformanceHistory
      parameters:
      - name: metric_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceHistory'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /athletes/{athlete_id}/benchmark-comparison:
    parameters:
    - name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Compare an athlete's latest results with benchmarks
      description: 'Permission: `athlete-performance:benchmark:read`.'
      operationId: compareWithBenchmarks
      parameters:
      - name: level
        in: query
        schema:
          type: string
      responses:
        '200':
          description: One row per metric with a benchmark
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BenchmarkComparison'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /athletes/{athlete_id}/clearance:
    parameters:
    - name: athlete_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get an athlete's fitness clearance
      description: 'Whether the athlete is cleared to train and compete. Permission: `athlete-performance:clearance:read`.'
      operationId: getClearance
      responses:
        '200':
          description: Current clearance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessClearance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Set an athlete's fitness clearance
      description: 'Set by medical staff after an assessment. Permission: `athlete-performance:clearance:write`.'
      operationId: setClearance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetClearanceRequest'
      responses:
        '200':
          description: Clearance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitnessClearance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/squad-summary:
    get:
      summary: Squad performance summary
      description: 'Latest result per key metric and trend for each athlete in a squad, discipline or coach group. Permission:
        `athlete-performance:report:read`.'
      operationId: getSquadSummary
      parameters:
      - name: discipline_id
        in: query
        schema:
          type: string
          format: uuid
      - name: coach_id
        in: query
        schema:
          type: string
          format: uuid
      - name: squad
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Summary rows
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SquadSummaryRow'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller lacks the permission this operation needs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the caller's organisation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
    Discipline:
      type: object
      description: A sport or event group an athlete competes in, e.g. Athletics (sprints), Wrestling.
      required:
      - id
      - organisation_id
      - name
      - category
      - active
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          example: Athletics (sprints)
        category:
          type: string
          enum:
          - individual
