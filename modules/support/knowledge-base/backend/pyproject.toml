[project]
name = "eos-knowledge-base"
version = "0.1.0"
description = "Education OS module: knowledge-base (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml", "httpx>=0.27", "eos-testing", "psycopg[binary]>=3.1"]

# platform/search finds this module's document provider here (platform/search README, "What each first module must add").
[project.entry-points."eos.search_documents"]
knowledge-base = "eos_knowledge_base.search:PROVIDER"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
