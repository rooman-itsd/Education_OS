[project]
name = "eos-sla-management"
version = "0.1.0"
description = "Education OS module: sla-management (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "sqlalchemy>=2",
  "alembic",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml", "httpx>=0.27", "eos-testing", "psycopg[binary]>=3.1"]

# The helpdesk ticket events this module consumes (module.yaml consumes_events), found by platform/event-bus.
[project.entry-points."eos.event_consumers"]
sla-management = "eos_sla_management.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
