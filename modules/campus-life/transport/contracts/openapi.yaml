openapi: 3.1.0
info:
  title: transport API
  version: 0.2.0
  description: "Routes, vehicles, passes, driver management, tracking. See docs/prd.md."
servers:
  - url: /api/v1/transport
paths:
  /stops:
    get:
      summary: Stops. Permission transport:route:read or transport:self:read.
      parameters: [{ name: q, in: query, description: Name contains, schema: { type: string } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Stop" } } } } } }
    post:
      summary: Create a stop. Permission transport:route:manage.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Stop" } } } } }
  /stops/{id}:
    patch:
      summary: Rename or move a stop. Permission transport:route:manage.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Stop" } } } } }
  /routes:
    get:
      summary: Routes with their stops in order. Riders use it to choose a route. Permission transport:route:read or transport:self:read.
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: stop_id, in: query, description: Routes that serve this stop, schema: { type: string, format: uuid } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Route" } } } } } }
    post:
      summary: Create a route. Permission transport:route:manage.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Route" } } } }, "409": { description: Route code already exists } }
  /routes/{id}:
    get:
      summary: One route with stops and pass count. Permission transport:route:read.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteDetail" } } } }, "404": { description: Not found } }
    patch:
      summary: Update name, stops and times, or deactivate. Permission transport:route:manage.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Route" } } } } }
  /routes/{id}/assignment:
    put:
      summary: >-
        Set the route's current vehicle and driver. Refused if the vehicle's insurance or fitness, or the driver's
        licence, has expired. Publishes transport.route.reassigned. Permission transport:route:manage.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [vehicle_id, driver_id], properties: { vehicle_id: { type: string, format: uuid }, driver_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Route" } } } }, "409": { description: "Vehicle or driver inactive, or a compliance document has expired" } }
  /routes/{id}/live:
    get:
      summary: The running trip on the route with its latest position and delay, or null. Permission transport:tracking:read, or transport:self:read with an issued pass on this route.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/LiveTrip" }, { type: "null" }] } } } }, "403": { description: No pass on this route } }
  /vehicles:
    get:
      summary: Vehicles. Permission transport:vehicle:read.
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: expiring_within_days, in: query, description: Vehicles with any compliance date within this many days (see transport.document.expiry-flagged), schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Vehicle" } } } } } }
    post:
      summary: Add a vehicle. Permission transport:vehicle:manage.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Vehicle" } } } }, "409": { description: Registration number already exists } }
  /vehicles/{id}:
    patch:
      summary: Update capacity or compliance dates, or deactivate. Permission transport:vehicle:manage.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VehicleInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Vehicle" } } } } }
  /drivers:
    get:
      summary: Drivers. Permission transport:vehicle:read.
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: expiring_within_days, in: query, description: Drivers whose licence expires within this many days, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Driver" } } } } } }
    post:
      summary: Add a driver. Permission transport:vehicle:manage.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DriverInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Driver" } } } } }
  /drivers/{id}:
    patch:
      summary: Update licence details or deactivate. Permission transport:vehicle:manage.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DriverInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Driver" } } } } }
  /passes:
    get:
      summary: Passes and pass requests. Permission transport:pass:read.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/PassStatus" } }
        - { name: route_id, in: query, schema: { type: string, format: uuid } }
        - { name: person_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PassPage" } } } } }
    post:
      summary: Issue a pass directly to a person. Publishes transport.pass.issued. Permission transport:pass:manage.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PassIssueInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Pass" } } } }, "409": { description: "Route full, stop not on route, or overlapping pass" } }
  /passes/{id}/decision:
    post:
      summary: >-
        Issue or reject a requested pass. Issuing over the vehicle's capacity needs override_capacity and a reason.
        Publishes transport.pass.issued or transport.pass.rejected. Permission transport:pass:manage.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [issued, rejected] }, reason: { type: string }, override_capacity: { type: boolean, default: false } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pass" } } } }, "409": { description: "Not requested, or route full without override" } }
  /passes/{id}/cancel:
    post:
      summary: Cancel a pass. Publishes transport.pass.cancelled. Permission transport:pass:manage, or transport:self:request for the caller's own pass.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Reason" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pass" } } } }, "409": { description: Already cancelled or expired } }
  /trips:
    post:
      summary: Start a trip on the route the caller drives. One running trip per route. Publishes transport.trip.started. Permission transport:tracking:record.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [route_id], properties: { route_id: { type: string, format: uuid } } } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }, "409": { description: "Trip already running, or caller is not the route's driver" } }
  /trips/{id}/positions:
    post:
      summary: Send one or more positions for a running trip. Permission transport:tracking:record.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/Position" } } } } }
      responses: { "204": { description: Accepted }, "409": { description: Trip not running } }
  /trips/{id}/delay:
    put:
      summary: Report the trip's current delay in minutes. Publishes transport.trip.delayed when the delay increases. Permission transport:tracking:record.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [delay_minutes], properties: { delay_minutes: { type: integer, minimum: 0 }, note: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } } }
  /trips/{id}/end:
    post:
      summary: End a running trip. Publishes transport.trip.completed. Permission transport:tracking:record.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }, "409": { description: Trip not running } }
  /notices:
    get:
      summary: Notices, including expired ones. Permission transport:notice:publish.
      parameters: [{ name: route_id, in: query, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notice" } } } } } }
    post:
      summary: >-
        Publish a notice to one route, or to all routes when route_id is null. A driver may publish only to the route
        they drive. Publishes transport.notice.published. Permission transport:notice:publish, or transport:tracking:record for the driver's own route.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoticeInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Notice" } } } } }
  /notices/{id}/withdraw:
    post:
      summary: Withdraw a notice before its expiry. Permission transport:notice:publish.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Notice" } } } } }
  /me/passes:
    get:
      summary: The caller's passes and pass requests, current first. Permission transport:self:read.
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pass" } } } } } }
    post:
      summary: Request a pass for a route and boarding stop. Publishes transport.pass.requested. Permission transport:self:request.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PassRequestInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Pass" } } } }, "409": { description: "Stop not on route, or an overlapping pass or request exists" } }
  /me/notices:
    get:
      summary: >-
        Current notices for the caller: notices for the routes of their issued passes plus notices to all routes,
        newest first. Backs the Student widget transport.notices. Permission transport:self:read.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notice" } } } } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, description: Opaque cursor from the previous page, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    Reason:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 3 } }
    StopInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
    Stop:
      allOf:
        - { $ref: "#/components/schemas/StopInput" }
        - type: object
          required: [id, organisation_id]
          properties: { id: { type: string, format: uuid }, organisation_id: { type: string, format: uuid } }
    RouteStop:
      type: object
      required: [stop_id, sequence]
      properties:
        stop_id: { type: string, format: uuid }
        stop_name: { type: string, readOnly: true }
        sequence: { type: integer, minimum: 1 }
        scheduled_time: { type: string, description: "Local time HH:MM", pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    RouteInput:
      type: object
      required: [code, name, stops]
      properties:
        code: { type: string }
        name: { type: string }
        direction: { type: string, description: "Label from the organisation, such as morning pick-up or evening drop" }
        stops: { type: array, minItems: 2, items: { $ref: "#/components/schemas/RouteStop" } }
        active: { type: boolean, default: true }
    Route:
      allOf:
        - { $ref: "#/components/schemas/RouteInput" }
        - type: object
          required: [id, organisation_id]
          properties:
            id: { type: string, format: uuid }
            organisation_id: { type: string, format: uuid }
            vehicle_id: { type: [string, "null"], format: uuid }
            vehicle_registration_no: { type: [string, "null"] }
            driver_id: { type: [string, "null"], format: uuid }
            driver_name: { type: [string, "null"] }
    RouteDetail:
      allOf:
        - { $ref: "#/components/schemas/Route" }
        - type: object
          properties:
            capacity: { type: [integer, "null"], description: "Capacity of the assigned vehicle" }
            passes_issued: { type: integer }
    VehicleInput:
      type: object
      required: [registration_no, capacity]
      properties:
        registration_no: { type: string }
        type: { type: string, description: "Label from the organisation, such as bus or van" }
        capacity: { type: integer, minimum: 1 }
        insurance_expires_on: { type: [string, "null"], format: date }
        fitness_expires_on: { type: [string, "null"], format: date }
        permit_expires_on: { type: [string, "null"], format: date }
        active: { type: boolean, default: true }
    Vehicle:
      allOf:
        - { $ref: "#/components/schemas/VehicleInput" }
        - type: object
          required: [id, organisation_id]
          properties: { id: { type: string, format: uuid }, organisation_id: { type: string, format: uuid } }
    DriverInput:
      type: object
      required: [name, licence_no, licence_expires_on]
      properties:
        person_id: { type: [string, "null"], format: uuid, description: "Set when the driver is also a staff member" }
        name: { type: string }
        licence_no: { type: string }
        licence_expires_on: { type: string, format: date }
        phone: { type: string }
        active: { type: boolean, default: true }
    Driver:
      allOf:
        - { $ref: "#/components/schemas/DriverInput" }
        - type: object
          required: [id, organisation_id]
          properties: { id: { type: string, format: uuid }, organisation_id: { type: string, format: uuid } }
    PassStatus: { type: string, enum: [requested, issued, rejected, cancelled, expired] }
    PassRequestInput:
      type: object
      required: [route_id, stop_id, valid_from, valid_to]
      properties:
        route_id: { type: string, format: uuid }
        stop_id: { type: string, format: uuid, description: "Boarding stop; must be on the route" }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
    PassIssueInput:
      allOf:
        - { $ref: "#/components/schemas/PassRequestInput" }
        - type: object
          required: [person_id]
          properties:
            person_id: { type: string, format: uuid }
            rider_type: { type: string, enum: [student, staff], default: student, description: "Carried on transport.pass.issued so fees-accounts can tell staff passes apart" }
            override_capacity: { type: boolean, default: false }
            reason: { type: string, description: "Required with override_capacity" }
    Pass:
      allOf:
        - { $ref: "#/components/schemas/PassRequestInput" }
        - type: object
          required: [id, organisation_id, person_id, status]
          properties:
            id: { type: string, format: uuid }
            organisation_id: { type: string, format: uuid }
            person_id: { type: string, format: uuid }
            person_name: { type: string, description: "Cached from student-information or hr-payroll" }
            rider_type: { type: string, enum: [student, staff] }
            route_code: { type: string }
            stop_name: { type: string }
            status: { $ref: "#/components/schemas/PassStatus" }
            decided_by: { type: [string, "null"], format: uuid }
            reason: { type: [string, "null"], description: "Rejection or cancellation reason" }
    PassPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Pass" } }
        next_cursor: { type: [string, "null"] }
    Trip:
      type: object
      required: [id, organisation_id, route_id, status, started_at]
      properties:
        id: { type: string, format: uuid }
        organisation_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        status: { type: string, enum: [running, completed] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        delay_minutes: { type: integer, minimum: 0, default: 0 }
    Position:
      type: object
      required: [recorded_at, latitude, longitude]
      properties:
        recorded_at: { type: string, format: date-time }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        speed_kmh: { type: [number, "null"], minimum: 0 }
    LiveTrip:
      allOf:
        - { $ref: "#/components/schemas/Trip" }
        - type: object
          properties:
            last_position: { oneOf: [{ $ref: "#/components/schemas/Position" }, { type: "null" }] }
            next_stop_id: { type: [string, "null"], format: uuid }
    NoticeKind: { type: string, enum: [delay, cancellation, route-change, general] }
    NoticeInput:
      type: object
      required: [kind, title, body]
      properties:
        route_id: { type: [string, "null"], format: uuid, description: "Null sends the notice to all routes" }
        kind: { $ref: "#/components/schemas/NoticeKind" }
        title: { type: string, maxLength: 120 }
        body: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
    Notice:
      allOf:
        - { $ref: "#/components/schemas/NoticeInput" }
        - type: object
          required: [id, organisation_id, published_at, status]
          properties:
            id: { type: string, format: uuid }
            organisation_id: { type: string, format: uuid }
            route_code: { type: [string, "null"] }
            published_at: { type: string, format: date-time }
            published_by: { type: string, format: uuid }
            status: { type: string, enum: [current, expired, withdrawn] }
