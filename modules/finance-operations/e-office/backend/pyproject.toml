[project]
name = "eos-e-office"
version = "0.2.0"
description = "Education OS module: e-office (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml", "httpx>=0.27", "eos-testing"]

# The overdue job (platform/scheduler) and the scheduler.job.due handler that runs it (platform/event-bus).
[project.entry-points."eos.scheduler_jobs"]
e-office = "eos_e_office.application.jobs:JOBS"

[project.entry-points."eos.event_consumers"]
e-office = "eos_e_office.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
