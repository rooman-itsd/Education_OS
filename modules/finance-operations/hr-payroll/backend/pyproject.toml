[project]
name = "eos-hr-payroll"
version = "0.2.0"
description = "Education OS module: hr-payroll (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2",
  "alembic>=1.13",
  "eos-core",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml", "httpx>=0.27", "eos-testing"]

# The exits job for platform/scheduler, and the event it reacts to (platform/event-bus).
[project.entry-points."eos.scheduler_jobs"]
hr-payroll = "eos_hr_payroll.application.jobs:JOBS"

[project.entry-points."eos.event_consumers"]
hr-payroll = "eos_hr_payroll.application.consumers:CONSUMERS"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
